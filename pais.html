<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de País - VisionChart</title>
    <!-- Chart.js para la gráfica -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 1000px; 
            margin: 40px auto; 
            padding: 0 20px; 
            background: #0d1117; 
            color: #c9d1d9; 
        }
        h1 { color: #00d2ff; margin: 0; }
        p { color: #8b949e; margin: 5px 0 0 0; }
        .card { 
            background: #161b22; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.6); 
            margin-bottom: 25px; 
            border: 1px solid #30363d;
        }
        .back-link { display: inline-block; margin-bottom: 15px; color: #00d2ff; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
        #status { font-weight: bold; margin-bottom: 15px; }

        /* Cabecera / Presentación del País */
        .hero-container {
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            border-bottom: 1px solid #30363d;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .country-flag {
            width: 140px;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #21262d;
            display: none;
        }
        .hero-main-info {
            flex: 1;
        }
        .highlight-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .highlight-item {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
        }
        .highlight-item strong {
            color: #00d2ff;
            font-size: 16px;
        }

        /* Cuadrícula de Métricas y Décadas */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .stat-box {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-box span {
            display: block;
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .stat-values {
            font-size: 15px;
            color: #e6edf3;
        }
        .stat-values strong {
            color: #00d2ff;
        }

        /* Estilos de la tabla */
        .table-container { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: #0d1117; border-radius: 6px; overflow: hidden; border: 1px solid #30363d; }
        th, td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #21262d; }
        th { background: #21262d; color: #e6edf3; font-weight: bold; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        .input-score { background: #161b22; border: 1px solid #30363d; color: #e6edf3; padding: 6px 10px; border-radius: 4px; width: 70px; text-align: center; font-size: 14px; }
        .input-score:focus { border-color: #00d2ff; outline: none; }
        .badge-readonly { background: #21262d; color: #c9d1d9; padding: 4px 8px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .withdrawn-text { color: #f85149; font-weight: bold; font-style: italic; }

        .chart-container { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 15px; position: relative; height: 400px; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- 1. Enlace de vuelta al index.php -->
    <a href="index.php" class="back-link">← Volver al Inicio</a>

    <!-- 2. Sección de Presentación (Carta del País) -->
    <div class="card">
        <div class="hero-container">
            <img id="country-flag" class="country-flag" alt="Bandera del país">
            <div class="hero-main-info">
                <h1 id="country-title">Cargando país...</h1>
                <p id="country-subtitle">Ficha técnica y rendimiento histórico.</p>
                
                <div class="highlight-group" id="hero-highlights" style="display: none;">
                    <div class="highlight-item">Nota General: <strong id="hero-avg-score">-</strong></div>
                    <div class="highlight-item">Posición Media Festival: <strong id="hero-avg-rank">-</strong></div>
                    <div class="highlight-item">Participaciones: <strong id="hero-participations">-</strong></div>
                </div>
            </div>
        </div>
        
        <div id="status">Conectando con la base de datos...</div>

        <!-- Métricas por Década -->
        <div style="margin-top: 20px;">
            <h3 style="color: #e6edf3; margin-bottom: 12px; font-size: 15px;">Rendimiento por Décadas</h3>
            <div class="stats-grid" id="decades-grid" style="display: none;">
                <!-- Se inyecta dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Próximo paso: Tabla y Gráfica -->
    <div class="card">
        <h2>📊 Historial Anual</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Año</th>
                        <th>Notas (Editable)</th>
                        <th>Posición Anual</th>
                        <th>Posición del País</th>
                    </tr>
                </thead>
                <tbody id="scores-table-body">
                    <!-- Se rellenará en el siguiente paso -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h2>📈 Progreso de Notas</h2>
        <div class="chart-container">
            <canvas id="chartCountryScores"></canvas>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://vekvnvxxdhehqizndkbe.supabase.co/rest/v1';
        const SUPABASE_ANON_KEY = 'sb_publishable_B3OZ26_f8n51pQAMjoEQbw_4K7zmGcl';

        const urlParams = new URLSearchParams(window.location.search);
        const rawCountryName = urlParams.get('nombre');

        async function cargarDatosPais() {
            const statusDiv = document.getElementById('status');
            const titleEl = document.getElementById('country-title');

            if (!rawCountryName) {
                titleEl.textContent = "País no especificado";
                statusDiv.textContent = "❌ No se ha indicado ningún país en la URL.";
                statusDiv.style.color = '#f85149';
                return;
            }

            const decodedCountry = decodeURIComponent(rawCountryName);
            titleEl.textContent = `🎵 ${decodedCountry}`;
            cargarBandera(decodedCountry);

            try {
                const headers = { 
                    'apikey': SUPABASE_ANON_KEY, 
                    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY 
                };

                const [resScores, resFestival, resYearly, resCountryRank] = await Promise.all([
                    fetch(`${SUPABASE_URL}/scores?country=eq.${encodeURIComponent(decodedCountry)}&order=year.asc`, { headers }),
                    fetch(`${SUPABASE_URL}/festival?order=year.asc`, { headers }),
                    fetch(`${SUPABASE_URL}/yearly_rankings?country=eq.${encodeURIComponent(decodedCountry)}`, { headers }),
                    fetch(`${SUPABASE_URL}/country_rankings?country=eq.${encodeURIComponent(decodedCountry)}`, { headers })
                ]);

                if (!resScores.ok || !resFestival.ok) throw new Error('Error al conectar con la base de datos.');

                const scoresData = await resScores.json();
                const festivalData = await resFestival.json();
                const yearlyData = await resYearly.json();
                const countryRankData = await resCountryRank.json();

                if (scoresData.length === 0) {
                    statusDiv.textContent = `⚠️ No se encontraron registros de puntuación para ${decodedCountry}.`;
                    statusDiv.style.color = '#d29922';
                    return;
                }

                statusDiv.textContent = `✅ Datos cargados correctamente.`;
                statusDiv.style.color = '#3fb950';

                // Mapear datos auxiliares
                const festivalMap = {};
                festivalData.forEach(f => { festivalMap[f.year] = f; });

                const yearlyMap = {};
                yearlyData.forEach(y => { yearlyMap[y.year] = y; }); // Guardamos el objeto completo para leer .score / .rank

                const countryRankMap = {};
                countryRankData.forEach(c => { countryRankMap[c.year] = c.position; });

                // Procesar Estadísticas de Cabecera (Nota general, media de rank yearly, participaciones y décadas)
                procesarEstadisticasCabecera(scoresData, yearlyData, festivalMap);

            } catch (error) {
                statusDiv.textContent = '❌ Error: ' + error.message;
                statusDiv.style.color = '#f85149';
                console.error(error);
            }
        }

        async function cargarBandera(countryName) {
            try {
                const res = await fetch(`https://restcountries.com/v3.1/name/${encodeURIComponent(countryName)}?fullText=false`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0 && data[0].flags?.svg) {
                        const flagImg = document.getElementById('country-flag');
                        flagImg.src = data[0].flags.svg;
                        flagImg.style.display = 'block';
                    }
                }
            } catch (e) {
                console.log('No se pudo cargar la bandera:', e);
            }
        }

        function procesarEstadisticasCabecera(scoresData, yearlyData, festivalMap) {
            const scoresValidos = scoresData.filter(i => i.score !== null && !isNaN(i.score));
            if (scoresValidos.length === 0) return;

            // 1. Nota general media
            const sumaScores = scoresValidos.reduce((acc, curr) => acc + Number(curr.score), 0);
            const mediaGeneral = (sumaScores / scoresValidos.length).toFixed(2);
            document.getElementById('hero-avg-score').textContent = mediaGeneral;

            // 2. Posición media en el festival (de yearly_rankings -> campo rank)
            const ranksValidos = yearlyData.filter(i => i.rank !== null && !isNaN(i.rank));
            if (ranksValidos.length > 0) {
                const sumaRanks = ranksValidos.reduce((acc, curr) => acc + Number(curr.rank), 0);
                const mediaRank = (sumaRanks / ranksValidos.length).toFixed(1);
                document.getElementById('hero-avg-rank').textContent = `${mediaRank}º`;
            } else {
                document.getElementById('hero-avg-rank').textContent = 'N/A';
            }

            // 3. Número de participaciones (años donde NO está retirado)
            let participaciones = 0;
            scoresData.forEach(item => {
                const fest = festivalMap[item.year];
                if (!fest || fest.withdrawn !== true) {
                    participaciones++;
                }
            });
            document.getElementById('hero-participations').textContent = participaciones;
            document.getElementById('hero-highlights').style.display = 'flex';

            // 4. Agrupación por décadas (Nota general de la década + Posición media rank de la década)
            const decadasMap = {};
            scoresData.forEach(item => {
                const decadaKey = Math.floor(item.year / 10) * 10 + 's';
                if (!decadasMap[decadaKey]) decadasMap[decadaKey] = { scores: [], ranks: [] };
                
                if (item.score !== null) decadasMap[decadaKey].scores.push(Number(item.score));
                
                // Buscar su rank anual correspondiente
                const yearlyMatch = yearlyData.find(y => y.year === item.year);
                if (yearlyMatch && yearlyMatch.rank !== null && !isNaN(yearlyMatch.rank)) {
                    decadasMap[decadaKey].ranks.push(Number(yearlyMatch.rank));
                }
            });

            const grid = document.getElementById('decades-grid');
            grid.innerHTML = '';

            Object.keys(decadasMap).sort().forEach(decada => {
                const data = decadasMap[decada];
                if (data.scores.length === 0) return;

                const mediaDecadaScore = (data.scores.reduce((a, b) => a + b, 0) / data.scores.length).toFixed(2);
                
                let mediaDecadaRank = 'N/A';
                if (data.ranks.length > 0) {
                    mediaDecadaRank = (data.ranks.reduce((a, b) => a + b, 0) / data.ranks.length).toFixed(1) + 'º';
                }

                const box = document.createElement('div');
                box.className = 'stat-box';
                box.innerHTML = `
                    <span>Década ${decada}</span>
                    <div class="stat-values">
                        Nota: <strong>${mediaDecadaScore}</strong><br>
                        Pos. Media: <strong>${mediaDecadaRank}</strong>
                    </div>
                `;
                grid.appendChild(box);
            });

            grid.style.display = 'grid';
        }

        cargarDatosPais();
    </script>

</body>
</html>
