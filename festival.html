<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Clasificaciones - VisionChart</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 1100px; 
            margin: 40px auto; 
            padding: 0 20px; 
            background: #0d1117; 
            color: #c9d1d9; 
        }
        h1 { color: #00d2ff; }
        p { color: #8b949e; }
        .card { 
            background: #161b22; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.6); 
            margin-bottom: 20px; 
            border: 1px solid #30363d;
        }
        #status { font-weight: bold; margin-bottom: 15px; }
        
        .back-link { display: inline-block; margin-bottom: 15px; color: #00d2ff; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #0d1117; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        th, td { padding: 10px 15px; text-align: center; border-bottom: 1px solid #21262d; border-right: 1px solid #161b22; }
        th:first-child, td:first-child { text-align: left; font-weight: bold; color: #fff; }
        th { background-color: #1f242c; color: #00d2ff; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; border-bottom: 2px solid #00d2ff; }
        tr:hover { background-color: #161b22; }

        .score-input {
            width: 60px;
            background: #21262d;
            color: #f0f6fc;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 5px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
        .score-input:focus {
            outline: none;
            border-color: #00d2ff;
            background: #0d1117;
            box-shadow: 0 0 5px rgba(0, 210, 255, 0.3);
        }
        .score-input:disabled {
            background: #12151a;
            color: #484f58;
            border-color: #21262d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Volver al inicio</a>

    <div class="card">
        <h1>Histórico de Clasificaciones 🎵</h1>
        <p>Matriz de puntuaciones por país y año. Los países retirados no se pueden editar.</p>
        <div id="status">Conectando con la base de datos...</div>
        
        <div style="overflow-x: auto;">
            <table id="matrix-table">
                <thead>
                    <tr id="table-headers">
                        <th>Países</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://vekvnvxxdhehqizndkbe.supabase.co/rest/v1';
        const SUPABASE_ANON_KEY = 'sb_publishable_B3OZ26_f8n51pQAMjoEQbw_4K7zmGcl';
    
        async function cargarMatrizHistorica() {
            const statusDiv = document.getElementById('status');
            const headerRow = document.getElementById('table-headers');
            const tableBody = document.getElementById('table-body');
            
            try {
                // 1. Obtenemos los datos de la tabla festival (incluyendo 'withdrawn')
                const resFestival = await fetch(`${SUPABASE_URL}/festival?select=*`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
                });
                const festivalData = await resFestival.json();

                const withdrawnMap = {};
                const countryIdMap = {};
                
                festivalData.forEach(item => {
                    countryIdMap[item.country] = item.id;
                    const fYear = item.year || 2026;
                    if (!withdrawnMap[item.country]) withdrawnMap[item.country] = {};
                    // Guardamos si está retirado en ese año
                    withdrawnMap[item.country][fYear] = item.withdrawn;
                });

                const countries = [...new Set(festivalData.map(item => item.country))].sort();

                // 2. Obtenemos todos los scores almacenados
                const resScores = await fetch(`${SUPABASE_URL}/scores?select=*&order=date.asc`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
                });
                const scoresData = await resScores.json();

                const years = [...new Set(scoresData.map(item => item.year))].sort((a, b) => a - b);

                if (countries.length === 0 || years.length === 0) {
                    throw new Error('No hay suficientes datos en las tablas.');
                }

                statusDiv.innerHTML = `✅ ¡Conexión exitosa! Matriz cargada (${years.join(', ')}).`;
                statusDiv.style.color = '#3fb950';

                headerRow.innerHTML = '<th>Países</th>';
                years.forEach(year => {
                    const th = document.createElement('th');
                    th.textContent = year;
                    headerRow.appendChild(th);
                });

                const scoresMap = {};
                scoresData.forEach(s => {
                    if (!scoresMap[s.country]) scoresMap[s.country] = {};
                    scoresMap[s.country][s.year] = s.score;
                });

                tableBody.innerHTML = '';
                countries.forEach(country => {
                    const row = document.createElement('tr');
                    
                    const countryTd = document.createElement('td');
                    countryTd.textContent = country;
                    row.appendChild(countryTd);

                    years.forEach(year => {
                        const td = document.createElement('td');
                        
                        // Verificamos si el país está retirado (withdrawn == true)
                        const isWithdrawn = withdrawnMap[country] && withdrawnMap[country][year] === true;

                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'score-input';

                        if (isWithdrawn) {
                            input.value = '-';
                            input.disabled = true;
                        } else {
                            const score = scoresMap[country] ? scoresMap[country][year] : undefined;
                            input.value = (score !== undefined && score !== null) ? score : '-';

                            const guardarCambio = async () => {
                                let val = input.value.trim();
                                let numericScore = null;

                                if (val === '-' || val === '') {
                                    numericScore = null;
                                } else {
                                    numericScore = parseInt(val, 10);
                                    if (isNaN(numericScore) || numericScore < 0 || numericScore > 100) {
                                        alert('⚠️ Introduce un número entero válido entre 0 y 100 (o "-" si no hay nota).');
                                        input.value = (score !== undefined && score !== null) ? score : '-';
                                        return;
                                    }
                                }

                                const options = { timeZone: 'Europe/Madrid', year: 'numeric', month: '2-digit', day: '2-digit' };
                                const formatter = new Intl.DateTimeFormat('es-ES', options);
                                const parts = formatter.formatToParts(new Date());
                                const day = parts.find(p => p.type === 'day').value;
                                const month = parts.find(p => p.type === 'month').value;
                                const yearDate = parts.find(p => p.type === 'year').value;
                                const spanishDate = `${yearDate}-${month}-${day}`;

                                const countryId = countryIdMap[country];

                                statusDiv.innerHTML = '⏳ Guardando en BBDD...';
                                statusDiv.style.color = '#d29922';

                                try {
                                    // Usamos upsert con merge-duplicates para actualizar el registro del año correctamente sin chocar con la primary key (id, year)
                                    const response = await fetch(`${SUPABASE_URL}/scores`, {
                                        method: 'POST',
                                        headers: {
                                            'apikey': SUPABASE_ANON_KEY,
                                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                                            'Content-Type': 'application/json',
                                            'Prefer': 'resolution=merge-duplicates'
                                        },
                                        body: JSON.stringify({
                                            id: countryId,
                                            country: country,
                                            year: year,
                                            date: spanishDate,
                                            score: numericScore
                                        })
                                    });

                                    if (!response.ok) {
                                        throw new Error('Error al guardar en Supabase');
                                    }

                                    statusDiv.innerHTML = `✅ Puntuación actualizada para ${country} (${year}) con fecha ${spanishDate}.`;
                                    statusDiv.style.color = '#3fb950';
                                    
                                    if (!scoresMap[country]) scoresMap[country] = {};
                                    scoresMap[country][year] = numericScore;

                                } catch (err) {
                                    statusDiv.innerHTML = '❌ Error al guardar: ' + err.message;
                                    statusDiv.style.color = '#f85149';
                                    console.error(err);
                                }
                            };

                            input.addEventListener('keydown', (e) => {
                                if (e.key === 'Enter') {
                                    input.blur();
                                }
                            });

                            input.addEventListener('blur', guardarCambio);
                        }

                        td.appendChild(input);
                        row.appendChild(td);
                    });

                    tableBody.appendChild(row);
                });

            } catch (error) {
                statusDiv.innerHTML = '❌ Error al cargar el histórico: ' + error.message;
                statusDiv.style.color = '#f85149';
                console.error('Error detallado:', error);
            }
        }

        cargarMatrizHistorica();
    </script>

</body>
</html>
